[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravix"
dynamic = ["version"]
description = "Applied regression modeling and visualization for business analytics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Daniel McGibney" }
]

keywords = [
    "regression",
    "ols",
    "logistic regression",
    "business analytics",
    "statistics",
    "education",
    "formula"
]

dependencies = [
    "numpy>=1.20",
    "pandas>=1.4",
    "statsmodels>=0.13",
    "matplotlib>=3.5,<3.13",
    "scipy",
    "scikit-learn",
    "seaborn"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.urls]
Homepage = "https://github.com/danielmcgibney/ravix"
Source = "https://github.com/danielmcgibney/ravix"
Issues = "https://github.com/danielmcgibney/ravix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ravix*"]
namespaces = false

[tool.setuptools.package-data]
ravix = ["data/*.csv"]

[tool.setuptools.dynamic]
version = {attr = "ravix._version.__version__"}
